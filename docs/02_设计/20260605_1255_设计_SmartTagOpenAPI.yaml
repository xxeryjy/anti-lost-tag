openapi: 3.0.3
info:
  title: SmartTag API
  version: 0.1.0
  description: |
    SmartTag 首版接口规范。
    真实接口开发前的冻结口径见：
    - 20260610_1127_设计_SmartTag真实接口契约冻结.md

    本规范基于以下设计文档整理：
    - SmartTag 核心流程与隐私策略
    - SmartTag 技术方案
    - SmartTag 接口设计
    - SmartTag 页面清单与状态流转
    - SmartTag 接口通用规范
servers:
  - url: /api
    description: SmartTag API Base URL
tags:
  - name: Auth
    description: 主人端认证接口
  - name: Tags
    description: 标签激活与主人端管理接口
  - name: Public
    description: Finder 公开接口
  - name: Uploads
    description: 图片上传接口
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: 注册主人账户
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
        - Auth
      summary: 登录
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 邮箱未完成验证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailNotVerified:
                  value:
                    success: false
                    error:
                      code: EMAIL_NOT_VERIFIED
                      message: 邮箱尚未完成验证
                    meta:
                      requestId: req_01JX1234567890
                      timestamp: '2026-06-05T04:12:30.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 登出
      operationId: logoutUser
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/verify-email/request:
    post:
      tags:
        - Auth
      summary: 请求邮箱验证流程
      operationId: requestEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: 请求已受理，当前不实际发送邮件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/verify-email/confirm:
    post:
      tags:
        - Auth
      summary: 使用固定验证码完成邮箱验证
      operationId: confirmEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailConfirmRequest'
      responses:
        '200':
          description: 邮箱验证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailConfirmResponse'
        '400':
          description: 验证码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCode:
                  value:
                    success: false
                    error:
                      code: INVALID_VERIFICATION_CODE
                      message: 验证码错误
                    meta:
                      requestId: req_01JX1234567890
                      timestamp: '2026-06-05T04:12:30.000Z'
        '409':
          description: 邮箱已验证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailAlreadyVerified:
                  value:
                    success: false
                    error:
                      code: EMAIL_ALREADY_VERIFIED
                      message: 邮箱已完成验证
                    meta:
                      requestId: req_01JX1234567890
                      timestamp: '2026-06-05T04:12:30.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: 请求找回密码流程
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: 请求已受理，当前不实际发送邮件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: 使用固定验证码重置密码
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          description: 验证码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCode:
                  value:
                    success: false
                    error:
                      code: INVALID_VERIFICATION_CODE
                      message: 验证码错误
                    meta:
                      requestId: req_01JX1234567890
                      timestamp: '2026-06-05T04:12:30.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/activate:
    post:
      tags:
        - Tags
      summary: 激活并绑定标签
      operationId: activateTag
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateTagRequest'
      responses:
        '200':
          description: 激活成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateTagResponse'
        '400':
          description: 参数错误或激活码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidActivationCode:
                  value:
                    success: false
                    error:
                      code: INVALID_ACTIVATION_CODE
                      message: 激活码错误
                    meta:
                      requestId: req_01JX1234567890
                      timestamp: '2026-06-05T04:12:30.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 标签已被绑定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tagAlreadyBound:
                  value:
                    success: false
                    error:
                      code: TAG_ALREADY_BOUND
                      message: 标签已被绑定
                    meta:
                      requestId: req_01JX1234567890
                      timestamp: '2026-06-05T04:12:30.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/my:
    get:
      tags:
        - Tags
      summary: 获取当前账号的标签列表
      operationId: listMyTags
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 标签状态筛选
          required: false
          schema:
            $ref: '#/components/schemas/TagStatus'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTagsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/{id}:
    delete:
      tags:
        - Tags
      summary: 删除主人名下标签
      operationId: deleteTag
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TagId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/{id}/status:
    patch:
      tags:
        - Tags
      summary: 更新标签状态
      operationId: updateTagStatus
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagStatusRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTagStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/{id}/profile:
    patch:
      tags:
        - Tags
      summary: 更新标签资料
      operationId: updateTagProfile
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TagId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagProfileRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTagProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 标签或资料不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/{id}/scans:
    get:
      tags:
        - Tags
      summary: 获取主人侧扫描历史
      operationId: listTagScans
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TagId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: locationSource
          in: query
          required: false
          description: 按定位来源筛选
          schema:
            $ref: '#/components/schemas/LocationSource'
        - name: notificationStatus
          in: query
          required: false
          description: 按扫描提醒状态筛选
          schema:
            $ref: '#/components/schemas/NotificationStatus'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagScansResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/{id}/messages:
    get:
      tags:
        - Tags
      summary: 获取主人侧匿名留言
      operationId: listTagMessages
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TagId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: deliveryStatus
          in: query
          required: false
          description: 按留言转发状态筛选
          schema:
            $ref: '#/components/schemas/DeliveryStatus'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagMessagesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/public/{uid}:
    get:
      tags:
        - Public
      summary: 获取 Finder 公开资料
      operationId: getPublicTag
      parameters:
        - $ref: '#/components/parameters/TagUid'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTagResponse'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/public/{uid}/scan:
    post:
      tags:
        - Public
      summary: 记录扫描日志
      operationId: createPublicScan
      parameters:
        - $ref: '#/components/parameters/TagUid'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScanRequest'
      responses:
        '200':
          description: 记录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags/public/{uid}/message:
    post:
      tags:
        - Public
      summary: 提交匿名留言
      operationId: createPrivacyMessage
      parameters:
        - $ref: '#/components/parameters/TagUid'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrivacyMessageRequest'
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePrivacyMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 当前标签未开启隐私留言
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                privacyDisabled:
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: 当前标签未开启隐私留言
                    meta:
                      requestId: req_01JX1234567890
                      timestamp: '2026-06-05T04:12:30.000Z'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /uploads/image:
    post:
      tags:
        - Uploads
      summary: 上传标签资料图片
      operationId: uploadImage
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadImageResponse'
        '400':
          $ref: '#/components/responses/UploadNotAllowed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: smarttag_session
  parameters:
    TagId:
      name: id
      in: path
      required: true
      description: 标签主键 ID
      schema:
        type: integer
        minimum: 1
    TagUid:
      name: uid
      in: path
      required: true
      description: 标签公开 UID
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 用于 Finder 公开接口的语言协商
      schema:
        type: string
        example: zh-CN,zh;q=0.9,en;q=0.8
  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidParams:
              value:
                success: false
                error:
                  code: BAD_REQUEST
                  message: 参数错误
                meta:
                  requestId: req_01JX1234567890
                  timestamp: '2026-06-05T04:12:30.000Z'
    Unauthorized:
      description: 未登录或登录失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: 未登录或登录失效
                meta:
                  requestId: req_01JX1234567890
                  timestamp: '2026-06-05T04:12:30.000Z'
    Forbidden:
      description: 无权限访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                success: false
                error:
                  code: FORBIDDEN
                  message: 无权限访问该资源
                meta:
                  requestId: req_01JX1234567890
                  timestamp: '2026-06-05T04:12:30.000Z'
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TagNotFound:
      description: 标签不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tagNotFound:
              value:
                success: false
                error:
                  code: TAG_NOT_FOUND
                  message: 标签不存在
                meta:
                  requestId: req_01JX1234567890
                  timestamp: '2026-06-05T04:12:30.000Z'
    RateLimited:
      description: 请求过于频繁
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimited:
              value:
                success: false
                error:
                  code: RATE_LIMITED
                  message: 请求过于频繁
                meta:
                  requestId: req_01JX1234567890
                  timestamp: '2026-06-05T04:12:30.000Z'
    UploadNotAllowed:
      description: 上传文件不符合要求
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            uploadNotAllowed:
              value:
                success: false
                error:
                  code: UNSUPPORTED_IMAGE_TYPE
                  message: 上传文件不符合要求
                meta:
                  requestId: req_01JX1234567890
                  timestamp: '2026-06-05T04:12:30.000Z'
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              value:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: 服务器内部错误
                meta:
                  requestId: req_01JX1234567890
                  timestamp: '2026-06-05T04:12:30.000Z'
  schemas:
    PreferredLocale:
      type: string
      enum:
        - zh-CN
        - en
        - ja
    TagStatus:
      type: string
      enum:
        - INACTIVE
        - ACTIVE
        - LOST
    ProfileCategory:
      type: string
      enum:
        - PET
        - ITEM
    PetKind:
      type: string
      enum:
        - CAT
        - DOG
        - OTHER
    ProfileSex:
      type: string
      enum:
        - MALE
        - FEMALE
        - UNKNOWN
    LocationSource:
      type: string
      enum:
        - GPS
        - IP
    NotificationStatus:
      type: string
      enum:
        - PENDING
        - SENT
        - FAILED
        - SKIPPED
    DeliveryStatus:
      type: string
      enum:
        - PENDING
        - SENT
        - FAILED
    Meta:
      type: object
      required:
        - requestId
        - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - meta
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/Meta'
    Pagination:
      type: object
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    UserSummary:
      type: object
      required:
        - id
        - email
        - emailVerifiedAt
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        preferredLocale:
          $ref: '#/components/schemas/PreferredLocale'
        timezone:
          type: string
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        preferredLocale:
          $ref: '#/components/schemas/PreferredLocale'
        timezone:
          type: string
